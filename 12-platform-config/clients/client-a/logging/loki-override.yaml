# Grafana Loki values for client-a. The initial profile is persistent single-node
# Loki, suitable for this development platform. Use S3-backed distributed Loki for HA.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: ebs-gp3
    accessModes:
      - ReadWriteOnce
    size: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# Disable components belonging to the other deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# A single-replica filesystem installation does not need external caches.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
