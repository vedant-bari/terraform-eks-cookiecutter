client:
  name: "client-a"
  account_id: "123456789012"
  region: "ap-south-1"

environment: "dev"

vpc:
  create: true
  name: "vpc-client-a-dev"
  cidr: "10.0.0.0/16"
  
  # Add your Availability Zones (ensure they match your ap-south-1 region)
  azs: 
    - "ap-south-1a"
    - "ap-south-1b"
    - "ap-south-1c"
    
  # Define the subnet blocks you want the module to create
  private_subnets: 
    - "10.0.1.0/24"
    - "10.0.2.0/24"
    - "10.0.3.0/24"
  public_subnets: 
    - "10.0.101.0/24"
    - "10.0.102.0/24"
    - "10.0.103.0/24"

  existing_id: null
  existing_private_subnets: []

  enable_nat_gateway: true

  single_nat_gateway: false

  enable_flow_logs: true

  enable_vpc_endpoints: true
