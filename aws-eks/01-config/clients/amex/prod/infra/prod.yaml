# ==============================================================================
# AWS PLATFORM CONFIGURATION: amex (PRODUCTION ENVIRONMENT)
# Source of truth for every live unit under aws-eks/04-live/clients/amex/prod.
#
# Values marked CHANGE_ME are placeholders. 07-tests/validation/validate_repo.py
# fails on any CHANGE_ME left in a prod infra file, and the aws provider refuses
# to run against any account other than aws.account_id.
# ==============================================================================

client:
  name: "amex"

environment: "prod"

aws:
  account_id: "000000000000"      # CHANGE_ME: 12-digit AWS account ID (provider allowed_account_ids guard)
  region: "ap-south-1"            # Mumbai, counterpart of GCP asia-south1
  profile: "CHANGE_ME"            # AWS CLI / SSO profile used by Terragrunt and the scripts; "" = default credential chain
  # Every layer after 00-bootstrap assumes the deploy role created by 00-bootstrap.
  assume_deploy_role: true
  # Applied to every Terraform-managed resource via provider default_tags.
  # Owner and CostCenter are required; the validator rejects CHANGE_ME in prod.
  tags:
    Client: "amex"
    Environment: "prod"
    ManagedBy: "terragrunt"
    Owner: "CHANGE_ME"
    CostCenter: "CHANGE_ME"

# Terraform state bucket and deploy role (00-bootstrap).
bootstrap:
  # Optional override. Default: <client>-<env>-tfstate-<account_id>.
  state_bucket_name: ""
  force_destroy: false
  noncurrent_versions_to_keep: 5   # Same retention as the GCP bucket lifecycle rule
  kms_key_arn: ""                  # "" = SSE-S3 (AES256); set a CMK ARN to use SSE-KMS
  account_ebs_encryption_by_default: true
  deploy_role:
    name: ""                       # Default: <client>-<env>-terraform-deploy
    # Principals allowed to assume the deploy role. Empty = any IAM principal in
    # this account that is itself allowed sts:AssumeRole on it.
    trusted_principal_arns: []
    managed_policy_arns:
      - "arn:aws:iam::aws:policy/AdministratorAccess"
    max_session_duration_seconds: 3600

# Network (01-network -> 03-modules/02-vpc).
# GCP: one /24 subnet with secondary ranges pods 10.1.0.0/18, services 10.2.0.0/20.
# AWS: pods take IPs from the node subnets (VPC CNI), so the private subnets are
# /19 to fit prefix delegation. The services CIDR (10.2.0.0/20) is set on the
# EKS cluster in Phase 2 and must not overlap this VPC.
vpc:
  name: ""                         # Default: <client>-<env>-vpc
  cidr: "10.100.0.0/16"
  azs: ["ap-south-1a", "ap-south-1b", "ap-south-1c"]   # Must match aws.region
  private_subnet_cidrs:            # Nodes and pods, one per AZ (8,190 IPs each)
    - "10.100.0.0/19"
    - "10.100.32.0/19"
    - "10.100.64.0/19"
  public_subnet_cidrs:             # Internet-facing ALBs and NAT only
    - "10.100.96.0/24"
    - "10.100.97.0/24"
    - "10.100.98.0/24"
  nat_gateway_per_az: false        # Class B: true = one NAT per AZ (about $35/month each)
  flow_logs:
    enabled: true
    traffic_type: "ALL"
    max_aggregation_interval: 60   # AWS minimum; GCP used 5 s with 0.5 sampling
    retention_days: 30
    force_destroy: true            # Bucket and logs are deleted with the environment, like GCP
  s3_gateway_endpoint: true        # Free; stand-in for Private Google Access
  interface_endpoints:             # Class B: about $7 per endpoint per AZ per month
    enabled: false
    services: ["ecr.api", "ecr.dkr", "sts", "secretsmanager", "logs"]

# EKS cluster (02-eks -> 03-modules/04-eks).
# Counterpart of the GCP gke: block. GCP behaviour is the default; class-B
# hardening toggles are marked.
eks:
  cluster_name: ""                 # Default: <client>-<env>-eks
  # Kubernetes minor. 1.34 is the oldest in standard support but it ends
  # 2026-12-02 and STANDARD would auto-upgrade it within weeks, so 1.35
  # (standard support until 2027-03-27, same minor as GCP) is used.
  # Check: aws eks describe-cluster-versions --region <region>
  kubernetes_version: "1.35"
  upgrade_support_type: "STANDARD" # STANDARD = no extended-support charge; EKS auto-upgrades at end of standard support
  deletion_protection: false       # GCP parity
  service_ipv4_cidr: "10.2.0.0/20" # Same as the GCP services range; must not overlap vpc.cidr
  endpoint:
    public_access_cidrs: ["0.0.0.0/0"]  # Class B: replace with an office/VPN allowlist
    private_only: false                 # Class B: true needs the SSM bastion or a VPN
  # Extra cluster admins (the deploy role is always admin). For SSO use the
  # role ARN without the aws-reserved/sso.amazonaws.com/ path, e.g.
  # arn:aws:iam::<account>:role/AWSReservedSSO_AdministratorAccess_<id>
  admin_principal_arns: []
  enable_irsa: false               # Everything uses Pod Identity
  control_plane_logs:
    types: ["api", "audit", "authenticator"]
    retention_days: 7
  node_azs: ["ap-south-1a"]        # GCP parity: one zone. Class B: list all vpc.azs
  node_group:                      # Applied per node AZ
    name: "general"
    instance_types: ["m7i.large"]  # 2 vCPU / 8 GiB, like e2-standard-2. Cheaper: t3a.large
    ami_type: "AL2023_x86_64_STANDARD"
    capacity_type: "ON_DEMAND"
    disk_size_gb: 100              # gp3, encrypted
    min_size: 2
    max_size: 10
    desired_size: 3                # GCP node_count; Cluster Autoscaler adjusts it afterwards
    max_unavailable: 1
    ami_release_version: ""        # "" = latest AMI for the version (like GKE node auto-upgrade); pin to freeze
    labels: {}
  max_pods: 110                    # Requires vpc_cni.prefix_delegation
  vpc_cni:
    prefix_delegation: true
  network_policy:
    enabled: false                 # Class B: VPC CNI network policy agent
  container_insights:
    enabled: false                 # Class B: amazon-cloudwatch-observability add-on (extra cost)
  # Pin add-on versions here. "" = the AWS default version for kubernetes_version
  # when the add-on is created. List versions with:
  #   aws eks describe-addon-versions --kubernetes-version 1.35 --addon-name <name> \
  #     --query 'addons[0].addonVersions[].addonVersion'
  addon_versions:
    vpc-cni: ""
    eks-pod-identity-agent: ""
    coredns: ""
    kube-proxy: ""
    metrics-server: ""
    aws-ebs-csi-driver: ""
    aws-efs-csi-driver: ""
    amazon-cloudwatch-observability: ""
    aws-secrets-store-csi-driver-provider: ""   # ASCP + Secrets Store CSI driver (GKE Secret Manager add-on)

# Container registry (03-ecr -> 03-modules/11-ecr).
# GCP: one Artifact Registry repo for all images. ECR: one repository per image,
# named <client>-<env>/<image>. Repositories come from every apps/*.yaml with
# ecr.enabled: true (basename of image.repository), plus additional_repositories.
ecr:
  additional_repositories: []      # Extra image names not tied to an app YAML
  image_tag_mutability: "MUTABLE"  # The pipeline pushes :latest
  scan_on_push: true               # Basic scanning, free
  force_delete: true               # Repos (and images) go with the environment, like GCP
  kms_key_arn: ""                  # "" = AES256
  lifecycle:
    keep_last_images: 30
    untagged_expire_days: 7

# Storage classes (04-storage -> 03-modules/07-storage-class).
storage:
  block:                           # GCP standard-rwo; cluster default
    storage_class_name: "gp3"
    kms_key_arn: ""                # "" = account default EBS key (aws/ebs)
  rwx:                             # GCP Filestore class amex-prod-rwx (Jenkins home, app /var/log)
    storage_class_name: ""         # Default: <client>-<env>-rwx (same name as GCP)
    throughput_mode: "elastic"     # Pay per use
    transition_to_ia: ""           # e.g. AFTER_30_DAYS; "" = never
    backup_enabled: false          # GCP parity (no Filestore backups); true = daily AWS Backup
    uid: 1000                      # EFS ignores fsGroup; must match the workload user (Jenkins = 1000)
    gid: 1000
    directory_perms: "700"

# Helm-installed controllers (05-cluster-addons -> 03-modules/09-cluster-addons).
# GKE has these built in. The ASCP secrets driver is an EKS add-on (eks.addon_versions).
cluster_addons:
  lb_controller:                   # GKE HTTP load balancing: Ingress -> ALB
    chart_version: "3.6.3"         # https://aws.github.io/eks-charts
    replica_count: 2
    service_account: "aws-load-balancer-controller"
  cluster_autoscaler:              # GKE node pool autoscaling (eks.node_group min/max)
    chart_version: "9.59.0"        # https://kubernetes.github.io/autoscaler (app 1.35)
    image_tag: "v1.35.0"           # Must match eks.kubernetes_version; bump them together
    service_account: "cluster-autoscaler"
    extra_args:
      balance-similar-node-groups: "true"   # Spread evenly when node_azs has several AZs
      skip-nodes-with-local-storage: "false" # Allow scale-down of nodes with emptyDir pods, like GKE
      expander: "least-waste"

# Cost controls. The aws_budgets_budget resource is added in Phase 8.
budget:
  monthly_limit_usd: "CHANGE_ME"
  alert_emails:
    - "CHANGE_ME"
  alert_thresholds_percent: [80, 100]
