{{- if .Values.secretsManager.enabled -}}
{{- /*
AWS Secrets Store CSI provider (ASCP). Each secret is mounted as
/mnt/secrets/<key>, the same layout as the GKE provider. The pod's service
account reads the secrets through its EKS Pod Identity role.
secretName is the full Secrets Manager name injected by 06-app-deploy
(<client>/<env>/<app>/<secretId>); secretId alone is used when it is absent.
*/ -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "generic-app.fullname" . }}-secretproviderclass
  namespace: {{ .Values.namespace.name }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      {{- range .Values.secretsManager.secrets }}
      - objectName: {{ .secretName | default .secretId | quote }}
        objectType: "secretsmanager"
        objectAlias: {{ .key | quote }}
      {{- end }}
{{- end }}
